[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.1.0"
description = "FastAPI API server and Temporal worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "pydantic-settings>=2.6",
  "temporalio>=1.11",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.26",
  "ruff==0.14.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["A", "B", "C4", "C90", "E", "F", "FAST", "I", "N", "Q", "RUF", "UP", "W", "YTT"]
ignore = [
  "E501",   # line length is the formatter's job
  "RUF029", # unused-async: pytest-asyncio tests are async by design
]
mccabe.max-complexity = 16
isort.known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
