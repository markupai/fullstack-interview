services:
  temporal:
    image: temporalio/temporal:1.9.1
    # In-memory: workflow history is lost on restart, which is fine here.
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: api
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

  worker:
    build: ./backend
    command: worker
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
